name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libopenmp-dev

      - name: Cache SuiteSparse GraphBLAS
        id: cache-graphblas
        uses: actions/cache@v4
        with:
          path: /tmp/GraphBLAS
          key: graphblas-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Build and install SuiteSparse GraphBLAS
        if: steps.cache-graphblas.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/DrTimothyAldenDavis/GraphBLAS.git /tmp/GraphBLAS
          make -j$(nproc) -C /tmp/GraphBLAS
          sudo make -C /tmp/GraphBLAS install
          sudo ldconfig

      - name: Install cached GraphBLAS
        if: steps.cache-graphblas.outputs.cache-hit == 'true'
        run: |
          sudo make -C /tmp/GraphBLAS install
          sudo ldconfig

      - name: Cache LAGraph
        id: cache-lagraph
        uses: actions/cache@v4
        with:
          path: /tmp/LAGraph
          key: lagraph-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: Build and install LAGraph
        if: steps.cache-lagraph.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/GraphBLAS/LAGraph.git /tmp/LAGraph
          make -j$(nproc) -C /tmp/LAGraph
          sudo make -C /tmp/LAGraph install
          sudo ldconfig

      - name: Install cached LAGraph
        if: steps.cache-lagraph.outputs.cache-hit == 'true'
        run: |
          sudo make -C /tmp/LAGraph install
          sudo ldconfig

      - name: Build project
        run: make -j$(nproc)

      - name: Run tests
        run: make test

      - name: Run benchmark validation
        run: ./bin/sssp_benchmark graphs/test.mtx 0 3.0
