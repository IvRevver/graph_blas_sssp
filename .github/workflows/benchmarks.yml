name: Benchmarks

on:
  workflow_dispatch:

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Cache LAGraph source
        uses: actions/cache@v4
        with:
          path: /tmp/LAGraph
          key: lagraph-src-${{ runner.os }}-1

      - name: Setup dependencies
        uses: ./.github/actions/setup

      - name: Configure and build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Run delta sweep
        run: |
          GRAPH=graphs/test.mtx
          if [ -f "graphs/astro-ph.mtx" ]; then GRAPH=graphs/astro-ph.mtx; fi
          echo "+-- Delta-Stepping Sweep --+"
          echo "| Algorithm             | Time (ms) | Iters  | Reachable | Status |"
          echo "+-----------------------+-----------+--------+-----------+--------+"
          i=0
          for d in 0.5 1.0 2.0 3.0 5.0 10.0; do
            i=$((i+1))
            if [ $i -eq 1 ]; then
              ./bin/sssp_benchmark "$GRAPH" 0 "$d" 2>&1 | awk -v d="$d" -v first=1 '
                /\[1\/3\]/ { a = sprintf("DS delta=%s", d); next }
                /\[2\/3\]/ { if(first) a = "Algebraic BF"; next }
                /\[3\/3\]/ { if(first) a = "Dijkstra"; next }
                a != "" && /^  \[OK\] [0-9]/ {
                  gsub(/,/,"",$5); gsub(/,/,"",$7);
                  printf "| %-22s | %7.2f | %5d | %9d | [OK]  |\n", a, $2, $5, $7;
                  a = "";
                }'
            else
              ./bin/sssp_benchmark "$GRAPH" 0 "$d" 2>&1 | awk -v d="$d" '
                /\[1\/3\]/ { a = sprintf("DS delta=%s", d); next }
                a != "" && /^  \[OK\] [0-9]/ {
                  gsub(/,/,"",$5); gsub(/,/,"",$7);
                  printf "| %-22s | %7.2f | %5d | %9d | [OK]  |\n", a, $2, $5, $7;
                  a = "";
                }'
            fi
          done
          echo "+-----------------------+-----------+--------+-----------+--------+"
