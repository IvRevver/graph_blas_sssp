name: Benchmarks

on:
  workflow_dispatch:


jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsuitesparse-dev cmake build-essential

      - name: Build and install LAGraph
        run: |
          git clone --depth 1 https://github.com/GraphBLAS/LAGraph.git /tmp/LAGraph
          cmake -S /tmp/LAGraph -B /tmp/LAGraph/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --build /tmp/LAGraph/build --target install -j$(nproc)
          sudo ldconfig

      - name: Configure and build Release
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Run delta sweep
        run: |
          GRAPH=graphs/test.mtx
          if [ -f "graphs/astro-ph.mtx" ]; then GRAPH=graphs/astro-ph.mtx; fi
          echo "+-- Delta-Stepping Sweep --+"
          echo "| Algorithm             | Time (ms) | Iters  | Reachable | Status |"
          echo "+-----------------------+-----------+--------+-----------+--------+"
          i=0
          for d in 0.5 1.0 2.0 3.0 5.0 10.0; do
            i=$((i+1))
            if [ $i -eq 1 ]; then
              ./bin/sssp_benchmark "$GRAPH" 0 "$d" 2>&1 | awk -v d="$d" -v first=1 '
                /\[1\/3\]/ { a = sprintf("DS delta=%s", d); next }
                /\[2\/3\]/ { if(first) a = "Algebraic BF"; next }
                /\[3\/3\]/ { if(first) a = "Dijkstra"; next }
                a != "" && /^  \[OK\] [0-9]/ {
                  gsub(/,/,"",$5); gsub(/,/,"",$7);
                  printf "| %-22s | %7.2f | %5d | %9d | [OK]  |\n", a, $2, $5, $7;
                  a = "";
                }'
            else
              ./bin/sssp_benchmark "$GRAPH" 0 "$d" 2>&1 | awk -v d="$d" '
                /\[1\/3\]/ { a = sprintf("DS delta=%s", d); next }
                a != "" && /^  \[OK\] [0-9]/ {
                  gsub(/,/,"",$5); gsub(/,/,"",$7);
                  printf "| %-22s | %7.2f | %5d | %9d | [OK]  |\n", a, $2, $5, $7;
                  a = "";
                }'
            fi
          done
          echo "+-----------------------+-----------+--------+-----------+--------+"
