name: CI

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  formatting:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find src/ tests/ benchmarks/ \( -name "*.c" -o -name "*.h" \) \
            -exec clang-format --dry-run --Werror {} +
        continue-on-error: false


  debug-build:
    name: Debug build and tests
    runs-on: ubuntu-latest
    needs: formatting

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsuitesparse-dev cmake build-essential

      - name: Build and install LAGraph
        run: |
          git clone --depth 1 https://github.com/GraphBLAS/LAGraph.git /tmp/LAGraph
          cmake -S /tmp/LAGraph -B /tmp/LAGraph/build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr/local
          sudo cmake --build /tmp/LAGraph/build --target install -j$(nproc)
          sudo ldconfig

      - name: Configure Debug
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
