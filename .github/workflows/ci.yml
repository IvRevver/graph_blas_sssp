name: CI

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  formatting:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find src/ tests/ benchmarks/ \( -name "*.c" -o -name "*.h" \) \
            -exec clang-format --dry-run --Werror {} +
        continue-on-error: false


  debug-build:
    name: Debug build and tests
    runs-on: ubuntu-latest
    needs: formatting

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache GraphBLAS source
        uses: actions/cache@v4
        with:
          path: GraphBLAS/
          key: graphblas-src-${{ runner.os }}-v1
          restore-keys: graphblas-src-${{ runner.os }}-

      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: build-debug/CMakeFiles
          key: cmake-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'src/*.c', 'tests/*.c') }}
          restore-keys: cmake-${{ runner.os }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libsuitesparse-dev cmake build-essential

      - name: Build and install GraphBLAS
        run: |
          git clone --depth 1 https://github.com/DrTimothyAldenDavis/GraphBLAS.git /tmp/GraphBLAS
          mkdir -p /tmp/GraphBLAS/build
          cmake -S /tmp/GraphBLAS -B /tmp/GraphBLAS/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_TESTING=OFF
          make -j$(nproc) -C /tmp/GraphBLAS/build
          sudo make -C /tmp/GraphBLAS/build install
          sudo ldconfig

      - name: Build and install LAGraph
        run: |
          GRAPHBLAS_DIR=$(find /usr -name "GraphBLASConfig.cmake" -type f 2>/dev/null | head -1 | xargs dirname)
          if [ -z "$GRAPHBLAS_DIR" ]; then
            echo "GraphBLASConfig.cmake not found" 1>&2
            exit 1
          fi
          echo "Found GraphBLAS at $GRAPHBLAS_DIR"
          git clone --depth 1 https://github.com/GraphBLAS/LAGraph.git /tmp/LAGraph
          mkdir -p /tmp/LAGraph/build
          cmake -S /tmp/LAGraph -B /tmp/LAGraph/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local
          make -j$(nproc) -C /tmp/LAGraph/build
          sudo make -C /tmp/LAGraph/build install
          sudo ldconfig

      - name: Configure Debug
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
