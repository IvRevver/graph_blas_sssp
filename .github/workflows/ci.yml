name: CI

on:
  push:
    branches: [main, work]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  formatting:
    name: Check formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find src/ tests/ benchmarks/ \( -name "*.c" -o -name "*.h" \) \
            -exec clang-format --dry-run --Werror {} +
        continue-on-error: false


  debug-build:
    name: Debug build and tests
    runs-on: ubuntu-latest
    needs: formatting

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache GraphBLAS source
        uses: actions/cache@v6
        with:
          path: GraphBLAS/
          key: graphblas-v10.3.1-${{ runner.os }}

      - name: Cache LAGraph source
        uses: actions/cache@v6
        with:
          path: LAGraph/
          key: lagraph-v1.2.1-${{ runner.os }}

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ccache-${{ runner.os }}

      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: build/CMakeFiles
          key: cmake-${{ runner.os }}-${{ hashFiles('**/CMakeLists.txt', 'src/**/*.c', 'tests/*.c', 'benchmarks/**/*.c') }}
          restore-keys: cmake-${{ runner.os }}-

      - name: Build and install GraphBLAS
        run: |
          if [ -f "/usr/local/lib/libgraphblas.so" ]; then
            echo "GraphBLAS already installed"
          elif [ -d "GraphBLAS" ] && [ -f "GraphBLAS/Makefile" ]; then
            echo "Building GraphBLAS from cached source"
            make -j$(nproc) -C GraphBLAS
            sudo make -C GraphBLAS install
            sudo ldconfig
          else
            echo "Cloning GraphBLAS v10.3.1"
            git clone --depth 1 --branch v10.3.1 https://github.com/DrTimothyAldenDavis/GraphBLAS.git
            make -j$(nproc) -C GraphBLAS
            sudo make -C GraphBLAS install
            sudo ldconfig
          fi

      - name: Build and install LAGraph
        run: |
          if [ -f "/usr/local/lib/liblagraph.so" ]; then
            echo "LAGraph already installed"
          elif [ -d "LAGraph" ] && [ -f "LAGraph/CMakeLists.txt" ]; then
            echo "Building LAGraph from cached source"
            cmake -S LAGraph -B LAGraph/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local
            make -j$(nproc) -C LAGraph/build
            sudo make -C LAGraph/build install
            sudo ldconfig
          else
            echo "Cloning LAGraph v1.2.1"
            git clone --depth 1 --branch v1.2.1 https://github.com/GraphBLAS/LAGraph.git
            cmake -S LAGraph -B LAGraph/build \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local
            make -j$(nproc) -C LAGraph/build
            sudo make -C LAGraph/build install
            sudo ldconfig
          fi

      - name: Configure Debug
        run: cmake -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure
